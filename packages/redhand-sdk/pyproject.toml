[project]
name = "redhand-sdk"
version = "0.1.0"
description = "RedHand SDK: Agent Tool Interceptor & <50ms In-Memory Semantic Firewall"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.19.2",
    "tokenizers>=0.20.0",
]

[project.scripts]
redhand = "redhand_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

