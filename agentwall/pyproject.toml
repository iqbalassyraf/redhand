[project]
name = "agentwall"
version = "0.1.0"
description = "AgentWall: Zero-Trust Agent Tool-Call Firewall & Ephemeral IAM Broker"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Architecture Team", email = "secops@redhand.internal" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlglot>=25.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "pyjwt[crypto]>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", ".", ".."]

[tool.ruff]
line-length = 100
target-version = "py311"

