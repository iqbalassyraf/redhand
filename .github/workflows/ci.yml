name: CI

# Runs on every push and on pull requests into main. Nothing here deploys, publishes or uses
# secrets; the jobs only read the repository.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff@0.17.3 check --config pyproject.toml .

      - name: Type-check (mypy --strict on the modules listed in pyproject.toml)
        run: uv run --frozen --with mypy==2.4.1 mypy

      - name: Tests (unit, integration and Phase 1 end-to-end)
        run: uv run --frozen pytest -q

  dashboard:
    name: Dashboard (tsc, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/redhand-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/redhand-ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
