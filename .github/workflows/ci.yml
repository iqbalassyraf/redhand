name: CI

# Runs on every push and on pull requests into main. Nothing here deploys, publishes or uses
# secrets; the jobs only read the repository.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff@0.17.3 check --config pyproject.toml .

      - name: Type-check (mypy --strict on the modules listed in pyproject.toml)
        run: uv run --frozen --with mypy==2.4.1 mypy

      - name: Tests (unit, integration and Phase 1 end-to-end)
        run: uv run --frozen pytest -q

      # Fails on any known vulnerability in a locked dependency (CLAUDE.md section 13). It reads the public advisory database, so a new
      # advisory can turn this red without a code change: fix by upgrading the package, or record why it does not apply here.
      - name: Dependency audit (pip-audit, locked versions)
        run: |
          uv export --frozen --no-hashes --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

  sql:
    name: SQL migrations (apply, tests, rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway PostgreSQL that exists only for this job. scripts/test_migrations.sh applies every
    # migration over a Supabase shim (pgcrypto in an "extensions" schema, as on Supabase), runs the SQL
    # tests, then rolls every migration back and re-applies it. It once caught a migration that could not
    # be applied on a fresh Supabase database.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations, run SQL tests, roll back and re-apply
        run: scripts/test_migrations.sh

  dashboard:
    name: Dashboard (tsc, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/redhand-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/redhand-ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Fails on a known high or critical vulnerability in a locked dependency. Same note as the Python audit: new advisories can turn it red.
      - name: Dependency audit (npm audit, high and above)
        run: npm audit --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
