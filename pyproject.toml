[project]
name = "redhand-workspace"
version = "0.1.0"
description = "RedHand: Agentic Security Posture Management (ASPM) & Runtime Protection Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redhand-sdk",
    "redhand-core",
    "redhand-sidecar",
    "agentwall",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
redhand-sdk = { workspace = true }
redhand-core = { workspace = true }
redhand-sidecar = { workspace = true }
agentwall = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/redhand-sdk",
    "services/redhand-core",
    "packages/redhand-sidecar",
    "agentwall",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/redhand-sdk/tests", "services/redhand-core/tests", "agentwall/tests", "tests/e2e"]
pythonpath = [".", "agentwall", "agentwall/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
