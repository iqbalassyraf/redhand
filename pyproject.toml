[project]
name = "redhand-workspace"
version = "0.1.0"
description = "RedHand: Agentic Security Posture Management (ASPM) & Runtime Protection Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redhand-sdk",
    "redhand-core",
    "redhand-sidecar",
    "agentwall",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
redhand-sdk = { workspace = true }
redhand-core = { workspace = true }
redhand-sidecar = { workspace = true }
agentwall = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/redhand-sdk",
    "services/redhand-core",
    "packages/redhand-sidecar",
    "agentwall",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/redhand-sdk/tests", "services/redhand-core/tests", "agentwall/tests", "tests/e2e", "tests/deploy"]
pythonpath = [".", "agentwall", "agentwall/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately small: syntax errors (E9) and pyflakes (F: unused imports and variables,
# undefined names). CI runs ruff with this file for every package (--config pyproject.toml).
# Widen the rule set in its own change when the code base is ready for it.
select = ["E9", "F"]

[tool.mypy]
# Strict type-checking on the modules written or changed in Phase 1. The older modules are not
# yet clean; add them here as they are brought up to standard (CLAUDE.md §6.4).
strict = true
explicit_package_bases = true
follow_imports = "silent"
files = [
    "services/redhand-core/src/redhand_core/auth",
    "services/redhand-core/src/redhand_core/passports",
    "services/redhand-core/src/redhand_core/main.py",
    "services/redhand-core/src/redhand_core/config.py",
    "services/redhand-core/src/redhand_core/routers/passports.py",
    "services/redhand-core/src/redhand_core/routers/agent_auth.py",
    "services/redhand-core/src/redhand_core/routers/dev.py",
    "services/redhand-core/src/redhand_core/routers/state.py",
    "services/redhand-core/src/redhand_core/routers/hitl.py",
    "services/redhand-core/src/redhand_core/routers/telegram.py",
    "services/redhand-core/src/redhand_core/routers/usage.py",
    "services/redhand-core/src/redhand_core/routers/blackbox.py",
    "services/redhand-core/src/redhand_core/routers/events.py",
    "services/redhand-core/src/redhand_core/blackbox",
    "services/redhand-core/src/redhand_core/honeytokens",
    "services/redhand-core/src/redhand_core/routers/honeytokens.py",
    "services/redhand-core/src/redhand_core/routers/mcp_scan.py",
    "services/redhand-core/src/redhand_core/routers/tool_pins.py",
    "services/redhand-core/src/redhand_core/toolpins",
    "services/redhand-core/src/redhand_core/telegram",
    "services/redhand-core/src/redhand_core/services/local_store.py",
    "services/redhand-core/src/redhand_core/services/local_rpc.py",
    "services/redhand-core/src/redhand_core/services/notifications/slack.py",
    "agentwall/src/gateway",
    "agentwall/src/bench",
    "agentwall/src/main.py",
    "agentwall/src/firewall/engine.py",
    "agentwall/src/firewall/radar.py",
    "agentwall/src/telemetry/audit_logger.py",
    "agentwall/config/settings.py",
]

[[tool.mypy.overrides]]
# PyYAML ships no type information and adding the stubs package would be a new dependency.
module = "yaml"
ignore_missing_imports = true
