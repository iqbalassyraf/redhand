apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sidecar
  labels:
    app.kubernetes.io/name: redhand-sidecar
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: redhand-sidecar
    app.kubernetes.io/instance: {{ .Release.Name }}

